<title>ANUPAL Compliance Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — left rail (collapses to a top scroller on phones) + work area; one gradient (logo) per screen.
   Tokens follow Compliance/docs/UX.md §1 (Stridenity brand). */
:root{
  --brand-coral:#EC5A3E;--brand-magenta:#D9285C;--brand-plum:#923C7C;--brand-blue:#2E8FD8;--brand-cyan:#2AA9C2;--brand-ink:#32353C;
  --brand-gradient:linear-gradient(135deg,#EC5A3E 0%,#D9285C 45%,#923C7C 100%);
  --bg:#F6F5F2;--surface:#FFFFFF;--surface-2:#F0EEEA;--border:#E2DED7;--text:#22252B;--text-2:#5A5F68;--text-3:#8A8F98;
  --accent:#C0285A;--accent-ink:#FFFFFF;--accent-soft:#FBE7EE;--focus:#2E8FD8;
  --ok:#1F8A5B;--ok-bg:#E3F3EA;--warn:#A86A12;--warn-bg:#FBF0DC;--risk:#C2362B;--risk-bg:#FBE4E1;--info:#2B6CB0;--info-bg:#E2EDF8;
  --ai:#6B4FBF;--ai-bg:#EEE9FA;--shadow:0 1px 2px rgba(34,37,43,.06),0 4px 14px rgba(34,37,43,.06);
  --radius-s:6px;--radius-m:10px;--radius-l:16px;
  --font-sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121317;--surface:#1A1C21;--surface-2:#22252B;--border:#2F333B;--text:#ECEDEF;--text-2:#A9AEB7;--text-3:#7B808A;
  --accent:#F0627F;--accent-ink:#121317;--accent-soft:#3A1F2A;--focus:#6CA8E8;
  --ok:#4CC38A;--ok-bg:#16301F;--warn:#E3A948;--warn-bg:#33270F;--risk:#F0786C;--risk-bg:#3A1C19;--info:#6CA8E8;--info-bg:#172638;
  --ai:#A894F0;--ai-bg:#241D3B;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317;--surface:#1A1C21;--surface-2:#22252B;--border:#2F333B;--text:#ECEDEF;--text-2:#A9AEB7;--text-3:#7B808A;
  --accent:#F0627F;--accent-ink:#121317;--accent-soft:#3A1F2A;--focus:#6CA8E8;
  --ok:#4CC38A;--ok-bg:#16301F;--warn:#E3A948;--warn-bg:#33270F;--risk:#F0786C;--risk-bg:#3A1C19;--info:#6CA8E8;--info-bg:#172638;
  --ai:#A894F0;--ai-bg:#241D3B;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:700}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand b{font-size:17px;letter-spacing:.06em}
.brand small{display:block;font-size:11px;color:var(--text-3);letter-spacing:.02em;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-s);color:var(--text-2);font-weight:600;font-size:13.5px}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--font-mono);background:var(--surface-2);color:var(--text-2);padding:1px 7px;border-radius:99px}
.nav button[aria-current="page"] .count{background:var(--accent);color:var(--accent-ink)}
.nav-sep{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:10px 10px 2px;font-weight:700}
.rail-foot{margin-top:auto;font-size:11.5px;color:var(--text-3);padding:6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar .grow{flex:1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;font-weight:700;color:var(--text-2)}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:7px 10px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:90px;resize:vertical}
.pill-select{max-width:100%;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:3px 4px 3px 12px}
.pill-select span{font-size:11.5px;color:var(--text-3);font-weight:700}
.pill-select select{min-width:0;max-width:100%;text-overflow:ellipsis;border:0;background:transparent;min-height:30px;padding:4px 6px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius-s);padding:7px 12px;font-weight:600;cursor:pointer;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ai{background:var(--ai-bg);border-color:transparent;color:var(--ai)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.view{padding-block:22px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1280px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--text-2);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:26px;font-weight:800;font-family:var(--font-mono);letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--text-2);font-weight:600}
.kpi.risk .v{color:var(--risk)}.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--text-2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.risk{background:var(--risk-bg);color:var(--risk)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.ai{background:var(--ai-bg);color:var(--ai)}
.chip.plain::before{display:none}
.risk-badge{font-family:var(--font-mono);font-size:11px;font-weight:700;width:22px;height:22px;display:inline-grid;place-items:center;border-radius:6px;flex:none}
.risk-H{background:var(--risk-bg);color:var(--risk)}.risk-M{background:var(--warn-bg);color:var(--warn)}.risk-L{background:var(--surface-2);color:var(--text-2)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);min-width:0}
.row:last-child{border-bottom:0}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--text-3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.click{cursor:pointer;border-radius:var(--radius-s)}
.row.click:hover{background:var(--surface-2)}
.date{font-family:var(--font-mono);font-size:12px;color:var(--text-2);white-space:nowrap;text-align:right;min-width:72px}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11.5px;color:var(--text-2);font-weight:700;padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:top}
td.num,th.num{text-align:right}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:32px;font-family:var(--font-mono);font-weight:700;line-height:1}
.ring .c small{font-size:11px;color:var(--text-3);font-weight:700;letter-spacing:.06em}
.factor{display:grid;grid-template-columns:178px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.risk i{background:var(--risk)}
.heat{display:grid;gap:4px;font-size:11.5px}
.heat .cell{border-radius:5px;padding:6px 4px;text-align:center;font-family:var(--font-mono);font-weight:600}
.h0{background:var(--surface-2);color:var(--text-3)}.h1{background:var(--ok-bg);color:var(--ok)}.h2{background:var(--warn-bg);color:var(--warn)}.h3{background:var(--risk-bg);color:var(--risk)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-s);background:var(--warn-bg);color:var(--text)}
.alert.risk{background:var(--risk-bg)}.alert.info{background:var(--info-bg)}.alert.ai{background:var(--ai-bg)}
.alert .ic{font-weight:800;font-family:var(--font-mono)}
.ai-block{border-left:3px solid var(--ai);background:var(--ai-bg);border-radius:0 var(--radius-s) var(--radius-s) 0;padding:12px 14px}
.draft{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--ai);border-radius:var(--radius-s);padding:16px 18px;white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:460px;overflow:auto}
.draft.approved{border-left-color:var(--ok)}
.stepper{display:flex;gap:0;flex-wrap:wrap}
.stepper .s{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-3);padding:6px 12px 6px 0}
.stepper .s i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--font-mono);font-size:11px;border:1.5px solid var(--border)}
.stepper .s.done{color:var(--ok)}.stepper .s.done i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stepper .s.cur{color:var(--accent)}.stepper .s.cur i{border-color:var(--accent);background:var(--accent-soft)}
.stepper .s+ .s::before{content:"";width:18px;height:1.5px;background:var(--border);margin-right:4px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}
.check:last-child{border-bottom:0}
.check .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);flex:none;display:grid;place-items:center;font-size:12px;margin-top:2px}
.check.on .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.timeline{display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.timeline .e{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px}
.timeline .e i{width:10px;height:10px;border-radius:50%;background:var(--text-3);margin-top:5px}
.timeline .e.ok i{background:var(--ok)}.timeline .e.risk i{background:var(--risk)}.timeline .e.ai i{background:var(--ai)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:700;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fact label{font-weight:600;font-size:12.5px}
.fact .why{font-size:11.5px;color:var(--text-3)}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden;width:max-content}
.toggle button{all:unset;cursor:pointer;padding:4px 12px;font-size:12px;font-weight:700;color:var(--text-2)}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sticky-side{position:sticky;top:76px;align-self:start}
.big-count{font-size:44px;font-family:var(--font-mono);font-weight:700;line-height:1}
.diff-add{color:var(--ok);font-weight:600}.diff-rem{color:var(--risk);font-weight:600;text-decoration:line-through}
details.ob{border-bottom:1px solid var(--border)}
details.ob summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 6px}
details.ob summary::-webkit-details-marker{display:none}
details.ob[open] summary{background:var(--surface-2)}
.ob-body{padding:10px 12px 14px 38px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;font-size:12.5px}
.ob-body ul{margin:4px 0 0;padding-left:18px}
.trace{font-family:var(--font-mono);font-size:12px;display:flex;flex-direction:column;gap:3px}
.trace .y{color:var(--ok)}.trace .n{color:var(--risk)}.trace .u{color:var(--warn)}
.group-h{display:flex;justify-content:space-between;align-items:center;padding:14px 6px 6px}
.drawer-back{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;border-left:1px solid var(--border);padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:rgba(10,12,16,.4);padding:16px}
.modal .box{background:var(--surface);border-radius:var(--radius-l);padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.otp{display:flex;gap:10px}
.otp input{width:48px;height:52px;text-align:center;font-size:22px;font-family:var(--font-mono);border:1.5px solid var(--border);border-radius:var(--radius-s);background:var(--surface-2)}
#toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;z-index:40}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:var(--radius-s);font-weight:600;font-size:13px;box-shadow:var(--shadow);max-width:360px;border-left:4px solid var(--brand-cyan)}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--risk)}.toast.ai{border-left-color:var(--ai)}
.validity{position:relative;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:120px}
.validity i{position:absolute;top:0;bottom:0;left:0;border-radius:99px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto}
.kcol{background:var(--surface-2);border-radius:var(--radius-m);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.chatlog{display:flex;flex-direction:column;gap:12px}
.msg{max-width:80ch;padding:12px 14px;border-radius:var(--radius-m);background:var(--surface);border:1px solid var(--border)}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg .cite{font-size:11.5px;color:var(--text-3);margin-top:6px}
.demo-ribbon{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:2px 10px}
.sample-badge{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 5px}
.review-badge{font-size:10.5px;font-weight:700;color:var(--text-3);border:1px dashed var(--text-3);border-radius:4px;padding:0 5px;white-space:nowrap}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hr{height:1px;background:var(--border)}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}.sticky-side{position:static}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px max(12px,env(safe-area-inset-left,0px));flex-direction:row;align-items:center;gap:10px;overflow-x:auto}
  .nav{flex-direction:row}.nav-sep,.rail-foot,.brand small{display:none}
  .nav button{padding:7px 10px;white-space:nowrap}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .ob-body{grid-template-columns:minmax(0,1fr);padding-left:12px}
  .topbar{position:static}
}
@media (max-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.factor{grid-template-columns:110px minmax(0,1fr) 40px}.kpi .v{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{transform:translateY(6px);opacity:.4}}}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EC5A3E"/><stop offset=".5" stop-color="#D9285C"/><stop offset="1" stop-color="#923C7C"/></linearGradient><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E8FD8"/><stop offset="1" stop-color="#2AA9C2"/></linearGradient></defs><path d="M3 15 L11 4 H31 L23 15 Z" fill="url(#lg1)"/><path d="M8 20 L14 13 H32 L26 20 Z" fill="#D9285C" opacity=".75"/><path d="M2 27 L8 20 H26 L20 27 Z" fill="url(#lg2)"/></svg>
      <div><b>ANUPAL</b><small>by Stridenity · compliance OS</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="rail-foot">Concept prototype · demo data only.<br>Content drafted for review, not legal advice.</div>

  <div class="main">
    <header class="topbar">

<script>
const SEED=/*__SEED__*/null;
const PROFILES=/*__PROFILES__*/null;
const TODAY=new Date('2026-10-16T09:00:00+05:30');
const $=(s,r=document)=>r.querySelector(s);

const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=s=>{const d=typeof s==='string'?D(s):s;return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};

/* ------------------------------------------------ global state (G) */
const USERS={
 mfg:[{id:'u1',name:'Priya Deshmukh',role:'maker',fn:'HR Executive'},{id:'u2',name:'Ravi Kulkarni',role:'checker',fn:'Accounts Head'},{id:'u3',name:'Anil Patwardhan',role:'approver',fn:'Plant Head'},{id:'u4',name:'Meera Joshi',role:'head',fn:'Compliance Head'},{id:'u5',name:'Suresh Shetty',role:'owner',fn:'Managing Director'}],
 hospital:[{id:'u1',name:'Sneha Pawar',role:'maker',fn:'HR & Admin Executive'},{id:'u2',name:'Dr. Kavita Rao',role:'checker',fn:'Quality Manager'},{id:'u3',name:'Dr. Nitin Gokhale',role:'approver',fn:'Medical Superintendent'},{id:'u4',name:'Farah Shaikh',role:'head',fn:'Compliance Head'},{id:'u5',name:'Dr. Arvind Mehta',role:'owner',fn:'Director'}],

/* ------------------------------------------------ rules engine (same JSON language as backend, ADR-004) */
const OPS={eq:(a,b)=>a===b,ne:(a,b)=>a!==b,gt:(a,b)=>a>b,gte:(a,b)=>a>=b,lt:(a,b)=>a<b,lte:(a,b)=>a<=b,in:(a,b)=>b.includes(a),contains:(a,b)=>Array.isArray(a)&&a.includes(b),not_contains:(a,b)=>Array.isArray(a)&&!a.includes(b)};
const OPTXT={eq:'=',ne:'≠',gt:'>',gte:'≥',lt:'<',lte:'≤',in:'is one of',contains:'includes',not_contains:'excludes'};
function derive(f){return {...f,total_workers:(+f.employees||0)+(+f.contract_workers||0)}}
function evalRule(r,f){
 if(r.all){const xs=r.all.map(x=>evalRule(x,f));const leaves=xs.flatMap(x=>x.leaves);
  if(xs.some(x=>x.ok===false))return{ok:false,leaves};if(xs.some(x=>x.ok===null))return{ok:null,leaves};return{ok:true,leaves}}
 if(r.any){const xs=r.any.map(x=>evalRule(x,f));const leaves=xs.flatMap(x=>x.leaves);
  if(xs.some(x=>x.ok===true))return{ok:true,leaves};if(xs.some(x=>x.ok===null))return{ok:null,leaves};return{ok:false,leaves}}
 if(r.not){const x=evalRule(r.not,f);return{ok:x.ok===null?null:!x.ok,leaves:x.leaves}}
 const v=f[r.fact];const meta=SEED.facts[r.fact]||{label:r.fact};
 if(v===undefined||v===null||v==='')return{ok:null,leaves:[{label:meta.label,txt:meta.label+' — not answered',ok:null}]};
 const ok=OPS[r.op](v,r.value);
 let txt;if(r.op==='eq'&&r.value===true)txt=meta.label+(ok?' — yes':' — no');else if(r.op==='eq'&&r.value===false)txt=meta.label+(ok?' — no':' — yes');
 else txt=meta.label+': '+(Array.isArray(v)?v.join(', '):v)+' '+OPTXT[r.op]+' '+(Array.isArray(r.value)?r.value.join(' / '):r.value);
 return{ok,leaves:[{label:meta.label,txt,ok}]}}
function register(f){const df=derive(f);return SEED.obligations.map(o=>{const e=evalRule(o.applies,df);return{o,ok:e.ok,leaves:e.leaves}})}

/* ------------------------------------------------ calendar engine (subset of ARCHITECTURE §4.2) */
const WIN_FROM='2026-08-20',WIN_TO='2027-01-31';
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
function dues(o,lic){const r=o.due_rule,out=[];const add=(d,period)=>{const s=iso(d);if(s>=WIN_FROM&&s<=WIN_TO)out.push({due:s,period})};
 const months=[[2026,6],[2026,7],[2026,8],[2026,9],[2026,10],[2026,11],[2026,12]];
 if(r.type==='monthly_day')months.forEach(([y,m])=>{const pm=m-1;add(new Date(y,m,r.day),MON[(pm+12)%12]+' '+(pm<0?y-1:y))});
 else if(r.type==='month_end'||r.type==='monthly_selfcheck')months.forEach(([y,m])=>add(new Date(y,m,lastDay(y,m)),MON[m]+' '+y));
 else if(r.type==='dates')[2026,2027].forEach(y=>r.dates.forEach(md=>{const [mm,dd]=md.split('-').map(Number);add(new Date(y,mm-1,dd),MON[(mm+10)%12]+' '+(mm<=2?y-1:y)+' cycle')}));
 else if(r.type==='annual')[2026,2027].forEach(y=>add(new Date(y,r.month-1,r.day),'FY '+(r.month<=3?(y-1)+'-'+String(y).slice(2):y-1+'-'+String(y).slice(2))));
 else if(r.type==='before_expiry'&&lic[r.licence]){const e=D(lic[r.licence]);e.setDate(e.getDate()-r.days);const s=iso(e);out.push({due:s<WIN_FROM?WIN_FROM:s,period:'Renewal · expires '+fmtD(lic[r.licence]),expiry:lic[r.licence]})}
 else if(r.type==='fixed')add(D(r.date),'Programme');
 return out}
function wfFor(o){return o.risk==='H'?'high_risk':(o.workflow==='event'?'event':(o.frequency==='continuous'?'fast':(TEMPLATES[o.workflow]?o.workflow:'standard')))}
function buildTenant(key){
 const P=PROFILES.tenants.find(t=>t.key===key);const facts={...P.facts};const reg=register(facts);
 const users=USERS[key];const R=rng(hash(key));const inst=[];let n=0;
 reg.filter(x=>x.ok).forEach(({o})=>dues(o,P.licences).forEach(d=>{
  const id=key+'-'+(++n);const wf=wfFor(o);const steps=TEMPLATES[wf];
  const it={id,key:o.id,o,title:o.title,period:d.period,due:d.due,expiry:d.expiry,wf,steps,stepIdx:0,state:'scheduled',log:[],evidence:{},draft:null,ref:'',delay:''};
  const dd=days(d.due,todayIso);const r=R();
  if(dd<0){ if(r<.86) finish(it,users,'closed',d.due,R); else if(r<.93) finish(it,users,'filed',d.due,R); else {it.state='in_preparation';it.log.push(ev('Opened · reminders sent',d.due,'info'))} }
  else if(dd<=15){ if(r<.35){it.state='open'} else if(r<.6){it.state='in_preparation';it.log.push(ev(users[0].name+' started preparation',iso(new Date(TODAY-2*864e5))))} else if(r<.8&&steps.length>2){it.stepIdx=1;it.state='in_review';it.log.push(ev(users[0].name+' submitted for review',iso(new Date(TODAY-864e5)),'ok'))} else {it.stepIdx=steps.length-1;it.state='pending_approval';it.log.push(ev(users[0].name+' submitted',iso(new Date(TODAY-3*864e5)),'ok'));if(steps.includes('checker'))it.log.push(ev(users[1].name+' reviewed and forwarded',iso(new Date(TODAY-864e5)),'ok'))}}
  inst.push(it)}));
 // planted stories
 const pin=(k,fn)=>{const x=inst.filter(i=>i.key===k).sort((a,b)=>a.due<b.due?-1:1);const t=x.find(i=>i.due>=WIN_FROM&&i.due<=iso(new Date(+TODAY+20*864e5))&&i.due>=iso(new Date(TODAY-20*864e5)))||x[0];if(t)fn(t)};
 if(key==='mfg'){
  pin('IN.SS.EPF.ECR',t=>{const s=inst.filter(i=>i.key==='IN.SS.EPF.ECR').find(i=>i.due==='2026-10-15');if(s){s.state='pending_approval';s.stepIdx=2;s.evidence={};s.log=[ev('Priya Deshmukh uploaded Sep payroll · 146 rows','2026-10-12','ok'),ev('Validation: 3 employees exceed 50% excluded-allowance limit (add-back applied)','2026-10-12','ai'),ev('Ravi Kulkarni reviewed and forwarded','2026-10-14','ok')]}});
  inst.filter(i=>i.key==='IN.ENV.CTO').forEach(t=>{t.state='in_preparation';t.log=[ev('Renewal window opened (expiry 23 Jan 2027 − 120 days)','2026-09-25','info'),ev('Reminder escalated to Compliance Head (T+7)','2026-10-02','risk')]});
  inst.filter(i=>i.key==='IN.BOILER').forEach(t=>{t.state='filed';t.ref='CIB/MH/APP/2026/88412';t.log=[ev('Inspection completed by Inspector of Boilers','2026-10-08','ok'),ev('Renewal application filed · awaiting certificate','2026-10-09','ok')]});
 }
 if(key==='hospital'){inst.filter(i=>i.key==='IN.HC.PNDT.REG').forEach(t=>{t.state='in_preparation';t.log=[ev('Renewal window opened (expiry 14 Nov 2026 − 30 days)','2026-10-15','info')]})}
 if(key==='infra'){inst.filter(i=>i.key==='MH.ELEC.CONLIC').forEach(t=>{t.state='open'})}
 return{P,facts,saved:{...facts},reg,users,inst,extra:[],notices:noticesFor(key),contractors:contractorsFor(key),changes:changesFor(),obs:obsFor(key),bg:{state:'none'},licences:{...P.licences}}}
function ev(txt,at,kind='info'){return{txt,at,kind}}
function finish(it,users,state,due,R){const late=R()<.08;const fd=new Date(D(due)-(late?-3:2+Math.floor(R()*5))*864e5);
 it.stepIdx=it.steps.length;it.log.push(ev(users[0].name+' prepared and submitted',iso(new Date(fd-4*864e5)),'ok'));
 it.steps.slice(1).forEach((r,i)=>it.log.push(ev(nameFor(users,r)+' approved'+(r==='approver'||r==='owner'?' (OTP verified)':''),iso(new Date(fd-(3-i)*864e5)),'ok')));
 it.ref=(it.o.authority||'REF').replace(/[^A-Z]/g,'').slice(0,4)+'/'+(1e6+Math.floor(R()*9e6));

 it.log.push(ev('Filed · ref '+it.ref+(late?' · late: '+it.delay:''),iso(fd),late?'risk':'ok'));
 if(state==='closed'){it.o.evidence.forEach(e=>it.evidence[e]='specimen-'+e.toLowerCase().replace(/[^a-z]+/g,'-').slice(0,24)+'.pdf');it.log.push(ev('Evidence complete · closed',iso(fd),'ok'))}
 else it.o.evidence.slice(0,1).forEach(e=>it.evidence[e]='specimen.pdf');
 it.state=state;it.late=late}

 :k==='infra'?[{id:'O1',title:'12 of 260 workers not registered with the welfare board',crit:'Code on Social Security — building workers registration',cause:'Contractor onboarding skips registration',effect:'Workers lose welfare benefits; principal employer liability',risk:'H',col:'Planned',owner:'Rahul Jadhav',due:'2026-11-05'}]

/* ------------------------------------------------ health score (skill compliance-domain) */
function health(){const t=T();const past=t.inst.filter(i=>i.due<=todayIso);if(!past.length)return{score:100,f:[]};
 const onTime=past.filter(i=>['closed','filed'].includes(i.state)&&!i.late).length/past.length;

 const od=past.filter(overdue);const highOpen=od.filter(i=>i.o.risk==='H').length/past.length;const odr=od.length/past.length;
 const score=Math.round(100*(.45*onTime+.25*evid+.2*(1-highOpen)+.1*(1-odr)));
 return{score,f:[['On-time filing',onTime,.45],['Evidence complete',evid,.25],['High-risk items clear',1-highOpen,.2],['Nothing overdue',1-odr,.1]]}}

function vHome(){const t=T();const h=health();const u=me();
 const next=t.inst.filter(i=>i.due>=todayIso&&i.due<=iso(new Date(+TODAY+30*864e5))&&!['closed','filed'].includes(i.state)).sort((a,b)=>a.due<b.due?-1:1);
 const od=t.inst.filter(overdue);const mine=t.inst.filter(canAct);const gaps=t.inst.filter(i=>i.state==='filed');

 const C=2*Math.PI*56;

 return`<div class="head"><div><div class="eyebrow">${esc(t.P.unit)} · ${esc(t.P.district)}, Maharashtra</div><h1>Good morning, ${esc(u.name.split(' ')[0].replace('Dr.','Dr'))}</h1><p>${od.length} overdue, ${next.length} due in the next 30 days, ${mine.length} waiting for you as ${ROLE_LABEL[u.role]}.</p></div><div class="inline"><button class="btn" data-page="calendar">Open calendar</button><button class="btn primary" data-page="inbox">My approvals (${mine.length})</button></div></div>
 <div class="grid g-main">

   <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:9px"><h2>Compliance health · last 12 months</h2>${h.f.map(([l,v,w])=>`<div class="factor"><span class="muted">${l} <span class="faint">×${w}</span></span><div class="bar ${v>.9?'ok':v>.75?'warn':'risk'}"><i style="width:${Math.round(v*100)}%"></i></div><span class="num">${Math.round(v*100)}%</span></div>`).join('')}<small class="faint">Score = 45% on-time + 25% evidence + 20% high-risk clear + 10% nothing overdue.</small></div></div></div>

/* ------------------------------------------------ Workflow engine (pure-ish transitions + SoD) */
function stepRole(i){return i.steps[i.stepIdx]}
function canAct(i){const u=me();if(['closed','na','scheduled'].includes(i.state))return false;
 if(i.state==='approved'||i.state==='filed')return u.role==='maker';if(i.stepIdx>=i.steps.length)return false;return stepRole(i)===u.role}
function actedBefore(i,u){return(i.actors||[]).includes(u.id)}
function act(i,action,extra={}){const u=me();const t=T();
 if(action==='submit'||action==='approve'){
  if(stepRole(i)!==u.role){toast(`This step needs the ${ROLE_LABEL[stepRole(i)]}. Switch "Acting as" to continue.`,'err');return}
  if(actedBefore(i,u)){toast('Segregation of duties: you already acted on this item, so you cannot approve it.','err');return}
  if(action==='submit'){const need=i.o.inputs.length;const fed=Object.keys(i.fed||{}).length;if(fed<need&&!i.draft){toast(`Feed the required data first (${fed}/${need}) or draft with AI.`,'err');return}}
  i.actors=[...(i.actors||[]),u.id];i.stepIdx++;
  i.log.push(ev(`${u.name} ${action==='submit'?'submitted for '+(i.steps[i.stepIdx]==='checker'?'review':'approval'):'approved'+(extra.otp?' (OTP verified)':'')}${extra.comment?' — “'+extra.comment+'”':''}`,todayIso,'ok'));
  if(i.stepIdx>=i.steps.length){i.state='approved';if(i.draft)i.draft.approved=true;i.log.push(ev('Approved · ready to file',todayIso,'ok'))}else i.state=i.steps[i.stepIdx]==='checker'?'in_review':'pending_approval';
  toast(i.state==='approved'?'Approved. The maker can now file and upload the acknowledgement.':'Sent to '+nameFor(t.users,i.steps[i.stepIdx]),'ok')}
 if(action==='return'){i.stepIdx=0;i.state='in_preparation';i.actors=[];i.log.push(ev(`${u.name} returned to maker — “${extra.reason}”`,todayIso,'risk'));toast('Returned to the maker with your reason.','')}
 if(action==='file'){if(i.due<todayIso&&!extra.delay){toast('This is late. Choose a delay reason before filing.','err');return}i.ref=extra.ref;i.delay=extra.delay||'';i.state='filed';i.log.push(ev(`${u.name} filed · ref ${extra.ref}${extra.delay?' · late: '+extra.delay:''}`,todayIso,extra.delay?'risk':'ok'));toast('Filed. Upload the remaining evidence to close it.','ok')}
 if(action==='evidence'){i.evidence[extra.slot]=extra.slot.toLowerCase().replace(/[^a-z]+/g,'-')+'.pdf';i.log.push(ev(`${u.name} uploaded evidence: ${extra.slot}`,todayIso,'ok'));
  if(i.state==='filed'&&i.o.evidence.every(e=>i.evidence[e])){i.state='closed';i.log.push(ev('All evidence present · closed automatically',todayIso,'ok'));toast('All evidence is in. Instance closed.','ok')}else toast('Evidence stored with a SHA-256 hash.','')}
 render()}

function payrollCalc(t){const R=rng(hash(t.P.key+'pay'));const n=t.facts.employees;let pfw=0,epf=0,eps=0,ee=0,esiw=0,esiE=0,esiR=0,add=0,el=0;
 for(let k=0;k<n;k++){const gross=13500+Math.floor(R()*42000);let basic=Math.round(gross*(.38+R()*.2));const excl=gross-basic;if(excl>gross*.5){basic+=excl-Math.round(gross*.5);add++}const w=Math.min(basic,15000);pfw+=w;ee+=w*.12;const e=Math.min(w*.0833,1250);eps+=e;epf+=w*.12-e;if(gross<=21000){el++;esiw+=gross;esiE+=gross*.0075;esiR+=gross*.0325}}
 return{n,pfw,ee,epf,eps,edli:pfw*.005,admin:pfw*.005,el,esiw,esiE,esiR,add}}

 if(tpl==='posh_annual_report'||tpl==='posh_policy'||tpl==='posh_notice')return H+`ANNUAL REPORT OF THE INTERNAL COMMITTEE (calendar year 2026)\nTo: The Employer, ${t.P.name}; copy to the District Officer, Thane\n\n1. Constitution of the Internal Committee: Presiding Officer and 3 members including one external member from an NGO; order dated 02 Jan 2026.\n2. Complaints received during the year: [INPUT NEEDED — from IC register]\n3. Complaints disposed of: [INPUT NEEDED]\n4. Cases pending for more than 90 days: [INPUT NEEDED]\n5. Awareness workshops held: 2 (Mar 2026, Aug 2026) — attendance sheets attached.\n6. Action taken by the employer: [INPUT NEEDED]\n\nThe policy and the names of IC members are displayed at the canteen notice board in English and Marathi.\n\nSigned: Presiding Officer, Internal Committee`;
 if(tpl==='display_notices_bilingual')return H+`DISPLAY NOTICE — WAGES & WORKING HOURS\n\nEnglish\nWage period: monthly. Wages are paid on or before the 7th of each month.\nWorking hours: 9:00 to 17:30 with a 30-minute rest interval.\n\nमराठी\nवेतन कालावधी: मासिक. प्रत्येक महिन्याच्या ७ तारखेपर्यंत वेतन दिले जाते.\nकामाचे तास: सकाळी ९:०० ते सायंकाळी ५:३०, ३० मिनिटांची विश्रांती.\n\nहिंदी\nवेतन अवधि: मासिक। प्रत्येक माह की 7 तारीख तक वेतन का भुगतान किया जाता है।\nकार्य समय: सुबह 9:00 से शाम 5:30, 30 मिनट का विश्राम।`;
 if(tpl==='bmw_form_iv')return H+`BMW ANNUAL REPORT — FORM IV WORKSHEET (Jan–Dec 2026)\nBeds: ${f.beds}   CBWTF: [operator name from agreement]\n\nCategory     Generated (kg)   Source\nYellow       from daily register (auto-summed)\nRed          from daily register\nWhite        from daily register\nBlue         from daily register\n\nTraining: ${f.beds>0?'4 sessions, 186 staff':''}; immunisation records: 92% of exposed staff.\nAccidents/spills reported: [INPUT NEEDED]`;

 case'na':toast('Request sent to the Compliance Head with your justification. Until approved, the obligation stays applicable.','');break;
 case'export':toast('Excel export with law, trace, owner and next due date is prepared (demo).','');break;
 case'feed':i.fed=i.fed||{};i.fed[d.x]=`uploaded ${fmtD(todayIso)} by ${me().name} · validated`;if(!i.log.length||i.state==='open'||i.state==='scheduled')i.state='in_preparation';i.log.push(ev(`${me().name} fed: ${d.x}`,todayIso,'ok'));toast('Uploaded and validated.','ok');render();break;
 case'draft':i.draft={text:draftFor(i),conf:i.fed&&Object.keys(i.fed).length===i.o.inputs.length?'high':'medium'};i.state=i.state==='open'||i.state==='scheduled'?'in_preparation':i.state;i.log.push(ev('AI drafted '+(i.o.ai_templates[0]||'document')+' (mock model) — needs human review','2026-10-16','ai'));toast('AI draft ready. Review it, then submit.','ai');render();break;
 case'submit':act(i,'submit');break;
 case'approve':{const r=stepRole(i);const cm=($('#cmt')||{}).value||'';if(r==='approver'||r==='owner'){if(stepRole(i)!==me().role||actedBefore(i,me())){act(i,'approve');break}otpModal(()=>act(i,'approve',{otp:true,comment:cm}))}else act(i,'approve',{comment:cm});break}
 case'return':{const r=($('#cmt')||{}).value.trim();if(!r){toast('Write what needs fixing — a return needs a reason.','err');$('#cmt').focus();break}act(i,'return',{reason:r});break}
 case'otpok':{const code=[1,2,3,4].map(k=>$('#o'+k).value).join('');if(code!=='2468'){toast('Wrong OTP. The demo OTP is 2468.','err');break}$('#overlay').innerHTML='';const f=G.pendingOtp;G.pendingOtp=null;f&&f();break}
 case'file':{const ref=$('#ref').value.trim();if(!ref){toast('Enter the acknowledgement or challan number.','err');break}act(i,'file',{ref,delay:($('#delay')||{}).value||''});break}
 case'evid':act(i,'evidence',{slot:d.x});break;
 case'why':drawer(`<span class="eyebrow">Why this draft</span><h2>${esc(i.o.ai_templates[0])}@v1 · mock provider</h2><div><span class="eyebrow">Sources used</span><ul><li>${esc(i.o.id)} — ${esc(i.o.law)}</li><li>Unit facts: ${esc(T().P.unit)} (employees ${T().facts.employees})</li>${Object.keys(i.fed||{}).map(x=>`<li>Fed: ${esc(x)}</li>`).join('')}</ul></div><div><span class="eyebrow">Confidence: ${esc(i.draft.conf)}</span><ul><li>${Object.keys(i.fed||{}).length}/${i.o.inputs.length} required inputs fed</li><li>Deterministic sections computed from pack rates</li><li>Narrative text by model; placeholders mark missing facts</li></ul></div><div><span class="eyebrow">Privacy</span><p class="muted">Names, UAN, Aadhaar and phone numbers were redacted before the model call and restored afterwards.</p></div><div><span class="eyebrow">Controls</span><p class="muted">AI drafts always go through the document workflow. No AI path can file, pay or approve.</p></div>`);break;
 case'whyx':drawer(`<span class="eyebrow">Extraction</span><h2>extract.consent@v1 · mock provider</h2><p class="muted">The PDF text was split by numbered conditions. Each condition was classified into frequency, risk and evidence, and anchored to its page. Low-confidence items are flagged for review.</p>`);break;
 case'extract':t.extract=CTO_CONDS.map(()=>null);toast('CTO specimen read: 8 conditions proposed.','ai');render();break;
 case'cond':t.extract[+d.k]=d.v;if(d.v==='a'){const c=CTO_CONDS[+d.k];t.extra.push({title:c[0],freq:c[1],risk:c[2],src:'CTO specimen, condition '+(+d.k+4)})}toast(d.v==='a'?'Added to the register with the licence as its source.':'Rejected and logged.',d.v==='a'?'ok':'');render();break;
 case'capa':{const o=t.obs.find(x=>x.id===d.k);const cols=['Planned','In progress','Verifying','Closed'];o.col=cols[cols.indexOf(o.col)+1];toast(o.col==='Closed'?'Fix verified by the auditor. CAPA closed.':'Moved to '+o.col,'ok');render();break}
 case'auditplan':toast('Plan drafted: 14 high-risk and 9 sampled medium-risk points for Q3, weighted by overdue history.','ai');break;
 case'nreply':{const n=t.notices.find(x=>x.id===d.k);n.text=replyText(n);toast('Reply drafted from your evidence. Review it before approving.','ai');render();break}
 case'napprove':{const n=t.notices.find(x=>x.id===d.k);if(me().role!=='approver'){toast('The Approver signs replies to authorities. Switch "Acting as" to Approver.','err');break}otpModal(()=>{n.state='approved';toast('Reply approved. A signed PDF is saved as evidence.','ok');render()});break}
 case'pack':toast('Inspection pack: an indexed PDF with licences, the last 6 months of returns and challans, registers and training records (demo).','');break;
 case'adopt':{const c=t.changes.find(x=>x.id===d.k);if(me().role!=='head'){toast('Only the Compliance Head can adopt changes. Switch "Acting as".','err');break}c.state='adopted';if(c.move)t.inst.filter(x=>x.key===c.move.key&&x.due===c.move.from).forEach(x=>{x.due=c.move.to;x.log.push(ev('Due date moved by adopted change '+c.id,todayIso,'info'))});toast('Adopted. Affected due dates updated and the change logged.','ok');render();break}
 case'ask':ask(d.v);break;
 case'provision':toast('Provisioning wizard: choose isolation tier, region, plan, packs, then invite the first admin (demo).','');break;
 case'bgreq':{const r=$('#bgr').value.trim(),tk=$('#bgt').value.trim();if(!r||!tk){toast('Give a reason and a ticket number.','err');break}t.bg={state:'pending',reason:r};render();break}
 case'bgapprove':t.bg={state:'active',until:'13:00'};toast('Support session active for 4 hours. The tenant can see this access in their audit log.','ok');render();break;
 case'close':$('#overlay').innerHTML='';break;}
});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.fact;if(f){const m=SEED.facts[f];T().facts[f]=m.type==='int'||m.type==='number'?(e.target.value===''?null:+e.target.value):e.target.value;render();const el=$('#f_'+f);el&&el.focus()}
 if(e.target.id==='tenantSel'){G.tenant=e.target.value;G.user='u1';fillSelects();go('home')}
 if(e.target.id==='userSel'){G.user=e.target.value;render();toast('Now acting as '+me().name+' · '+ROLE_LABEL[me().role],'')}});
document.addEventListener('input',e=>{const m=/^o(\d)$/.exec(e.target.id);if(m&&e.target.value&&+m[1]<4)$('#o'+(+m[1]+1)).focus()});
document.addEventListener('keydown',e=>{const m=/^o(\d)$/.exec(e.target.id||'');if(m&&e.key==='Backspace'&&!e.target.value&&+m[1]>1)$('#o'+(+m[1]-1)).focus();if(m&&e.key==='Enter')document.querySelector('[data-act="otpok"]').click();if(e.key==='Escape')$('#overlay').innerHTML=''});
document.addEventListener('submit',e=>{if(e.target.id==='ask'){e.preventDefault();ask($('#q').value)}});
function ask(q){if(!q||!q.trim())return;const t=T();t.chat.push({me:true,txt:q});t.chat.push({me:false,...answer(q)});render()}
function fillSelects(){$('#tenantSel').innerHTML=PROFILES.tenants.map(p=>`<option value="${p.key}" ${p.key===G.tenant?'selected':''}>${esc(p.name)}</option>`).join('');$('#userSel').innerHTML=T().users.map(u=>`<option value="${u.id}" ${u.id===G.user?'selected':''}>${esc(u.name)} · ${ROLE_LABEL[u.role]}</option>`).join('')}
function syncTheme(){document.querySelectorAll('[data-act="theme"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===G.theme))}
try{const th=localStorage.getItem('anupal-theme');if(th){G.theme=th;if(th!=='system')document.documentElement.dataset.theme=th}}catch(_){}
$('#today').textContent='Today · '+fmtD(todayIso);
fillSelects();syncTheme();
const h=(location.hash||'').slice(1);if(h&&PAGES.some(p=>p[0]===h))G.page=h;
render();
</script>
